name = "nemesismodscore"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "nemesismods.com/*", zone_name = "nemesismods.com" },
]

[assets]
directory = "./dist"
binding = "ASSETS"

# each tool's own Worker, in the same Cloudflare account
[[services]]
binding = "LAB"
service = "nemesismods-imperfectlab"

[[services]]
binding = "BUILDER"
service = "nemesismods-labbuilder"

[[services]]
binding = "ARENA"
service = "nemesismods-arenalab"
